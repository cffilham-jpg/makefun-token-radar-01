<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Launch Observatory · radar-4</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="../data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell" id="main-view">
    <header><b class="brand">◉ LAUNCH OBSERVATORY <small>/ radar-4</small></b><span>SEALED <span id="asof"></span></span></header>
    <div id="verify-badge"></div>
    <section class="hero"><h1>Find the signal before the ticker.</h1><p>A snapshot-based value map, with blind tests and a costed route from research to exit. Records no token ≠ proof of absence.</p></section>
    <section id="stats" class="stats"></section>
    <nav id="tabs">
      <button data-tab="board">Radar board</button>
      <button data-tab="farms">Farm shortlist</button>
      <button data-tab="live">Already trading</button>
      <button data-tab="model">Method & evidence</button>
      <span id="board-count"></span>
    </nav>
    <section id="model-strip"></section>
    <section class="controls" id="controls">
      <label class="search">Search<input id="search" placeholder="Protocol or slug"></label>
      <label>Category<select id="category"></select></label>
      <label>Chain<select id="chain"></select></label>
      <label>Signal<select id="signal"></select></label>
      <label>Verdict<select id="verdict"></select></label>
      <label>Sort<select id="sort"></select></label>
      <button id="reset">Reset</button>
    </section>
    <main id="content"></main>
    <footer>LAUNCH OBSERVATORY <span>Conditional estimates · no launch or reward promised · offline by design</span></footer>
  </div>
  <div id="detail-root"></div>
</body>
</html>
